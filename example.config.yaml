# Settings shared by all jobs (each job can override anything)
defaults:
  robot: ./robot              # path to the robot executable
  python: python3
  obo2tex: obo2tex.py
  reasoner: elk               # elk (default) | hermit | jfact | whelk | emr | structural | none
  select: "self parents"
  stepwise: false             # true = one ROBOT call per step (intermediate files in /tmp)
  env:                        # environment variables for the subprocesses
    ROBOT_JAVA_ARGS: "-Xmx4G"
  extra_args:                 # appended to the respective command
    merge: []
    reason: []
    filter: []
    convert: []
    obo2tex: []

jobs:
  - name: american
    input: ./pizza_fixed.ofn          # string or list of files
    filter_terms:
      - http://www.co-ode.org/ontologies/pizza/pizza.owl#American
    output: graph.tex

  - name: margherita_hermit
    input:
      - ./pizza_fixed.ofn
    reasoner: hermit
    filter_terms:
      - http://www.co-ode.org/ontologies/pizza/pizza.owl#Margherita
      - http://www.co-ode.org/ontologies/pizza/pizza.owl#Mushroom
    select: "self descendants"
    output: out/margherita.tex
    extra_args:
      filter: ["--preserve-structure", "false"]
      obo2tex: []
    # extra ROBOT steps injected between the built-in ones
    steps:
      after_merge:
        - "remove --select imports"
      after_reason:
        - ["relax"]
      after_filter:
        - "reduce --reasoner elk"
