# Settings shared by all jobs (every job can override any of them).
# See CONFIG.md for the full reference.
defaults:
  robot_version: "1.9.11"     # downloaded once into the state folder
  java_args: ["-Xmx4G"]       # JVM options
  reasoner: elk               # elk | hermit | jfact | whelk | emr | structural | none
  select: "self parents"
  obo2tex:                    # flags for obo2tex.py
    standalone: false
    no_macros: false
    no_root: false

jobs:
  - name: american
    input: ./pizza_fixed.ofn
    filter_terms:
      - http://www.co-ode.org/ontologies/pizza/pizza.owl#American
    output: out/graph.tex

  - name: margherita_hermit
    input:
      - ./pizza_fixed.ofn
    reasoner: hermit
    filter_terms:
      - http://www.co-ode.org/ontologies/pizza/pizza.owl#Margherita
      - http://www.co-ode.org/ontologies/pizza/pizza.owl#Mushroom
    select: "self descendants"
    output: out/margherita.tex
    obo2tex:
      standalone: true        # complete compilable LaTeX document
      no_root: true
    extra_args:
      filter: ["--preserve-structure", "false"]
    steps:                    # extra ROBOT steps between the built-in ones
      after_merge:
        - "remove --select imports"
      after_reason:
        - ["relax"]
      after_filter:
        - "reduce --reasoner elk"

  - name: sty                 # only writes the LaTeX macro package, no ROBOT run
    output: out/obohierarchy.sty
    obo2tex:
      sty: true
